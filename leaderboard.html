<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SKYHOOK ASCENT RANKING</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Syne:wght@700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { min-height:100%; overflow-x:hidden; overflow-y:auto; background:#070510; color:#fff;
    font-family:'Syne',sans-serif; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; }
  body { display:block; min-height:100dvh; padding:16px 0;
    background:radial-gradient(ellipse at 50% -10%,rgba(0,200,255,.18),transparent 55%),
      radial-gradient(ellipse at 50% 110%,rgba(156,219,60,.14),transparent 50%),#070510; }
  .shell { display:flex; align-items:flex-start; justify-content:center; min-height:calc(100dvh - 32px); }
  .page { width:100vw; min-height:100vh; min-height:100dvh; height:auto; position:relative;
    overflow:visible; border:1px solid rgba(0,200,255,.22); padding:58px 14px 28px; }
  @media (orientation:landscape) {
    .page { width:min(100vw,calc(100vh * 9 / 16)); width:min(100vw,calc(100dvh * 9 / 16));
      height:100vh; height:100dvh; }
  }
  .page::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.2) 3px,transparent 4px); mix-blend-mode:overlay; }
  .back { position:absolute; left:14px; top:14px; z-index:2; min-width:34px; height:34px; padding:0 12px;
    display:flex; align-items:center; justify-content:center; border:1px solid rgba(0,200,255,.42);
    background:rgba(7,5,16,.72); color:#00c8ff; text-decoration:none; font-family:'Syne',sans-serif;
    font-size:12px; font-weight:800; letter-spacing:1px; box-shadow:0 0 16px rgba(0,200,255,.18), inset 0 0 12px rgba(0,200,255,.08); }
  .title { font-family:'Syne',sans-serif; font-weight:800; font-size:clamp(24px,4.7vh,42px); line-height:.9;
    letter-spacing:0; text-align:center; color:#fff; text-shadow:0 0 20px #00c8ff,0 0 36px rgba(156,219,60,.45); }
  .title span { color:#9cdb3c; text-shadow:0 0 18px #9cdb3c; }
  .panel { position:relative; z-index:1; margin-top:24px; border:1px solid rgba(0,200,255,.28);
    background:rgba(7,5,16,.62); box-shadow:0 0 24px rgba(0,200,255,.12), inset 0 0 18px rgba(0,200,255,.06); }
  .row { display:grid; grid-template-columns:54px minmax(0,1fr) 92px 116px; gap:10px; align-items:center; min-height:62px;
    padding:0 8px; border-bottom:1px solid rgba(0,200,255,.12); }
  .row:last-child { border-bottom:0; }
  .head { min-height:44px; color:#9fb1c4; font-family:'Syne',sans-serif; font-size:14px; letter-spacing:0; }
  .rank { font-family:'Syne',sans-serif; color:#9cdb3c; font-weight:800; font-size:22px; letter-spacing:0; }
  .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:'Noto Sans KR',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:800; font-size:22px; min-width:0; }
  .alt { text-align:right; color:#00c8ff; font-family:'Noto Sans KR',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:900; font-size:22px; letter-spacing:0; white-space:nowrap; }
  .time { text-align:right; color:#9fb1c4; font-family:'Noto Sans KR',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:800; font-size:14px; letter-spacing:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .state { padding:24px 14px; text-align:center; color:#9fb1c4; line-height:1.45; font-size:13px; }
  .mode-tabs { margin-top:18px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mode-tab { border:1px solid rgba(0,200,255,.34); background:rgba(7,5,16,.7); color:#9fb1c4;
    font-family:'Syne',sans-serif; font-size:17px; font-weight:800; letter-spacing:1px; padding:13px 0; cursor:pointer; }
  .mode-tab.active { color:#070510; background:#9cdb3c; border-color:#9cdb3c; }
  .mode-tab:active { transform:scale(.98); }
  .local { margin-top:14px; text-align:center; color:#9cdb3c; font-family:'Syne',sans-serif; font-size:16px; letter-spacing:0; }

  @media (max-width:380px) {
    .page { padding-left:10px; padding-right:10px; }
    .row { grid-template-columns:44px minmax(0,1fr) 78px 104px; gap:6px; padding:0 6px; }
    .rank,.name,.alt { font-size:17px; }
    .time { font-size:12px; }
  }
</style>
</head>
<body draggable="false">
  <div class="shell">
  <main class="page">
    <a class="back" id="backBtn" href="index.html" aria-label="back to game">GAME</a>
    <h1 class="title">SKYHOOK<br><span>RANKING</span></h1>
    <div class="mode-tabs" role="tablist" aria-label="leaderboard mode">
      <button class="mode-tab active" data-mode="normal" type="button">NORMAL</button>
      <button class="mode-tab" data-mode="extreme" type="button">EXTREME</button>
    </div>
    <section class="panel" aria-label="leaderboard">
      <div class="row head"><div>RANK</div><div>NAME</div><div>ALT</div><div>TIME</div></div>
      <div id="rankRows"><div class="state">랭킹 서버 설정 대기 중</div></div>
    </section>
    <div class="local" id="localBest">LOCAL BEST 0m</div>
  </main>
  </div>

<script src="supabase-config.js"></script>
<script>
const rows=document.getElementById('rankRows');
const params=new URLSearchParams(location.search);
let currentMode=params.get('mode')==='extreme' ? 'extreme' : 'normal';
const modeKey=mode=>mode==='extreme' ? 'skyhook_best_extreme' : 'skyhook_best_normal';
const backBtn=document.getElementById('backBtn');
const localBestEl=document.getElementById('localBest');
function supabaseSettings(){
  const cfg=window.SKYHOOK_SUPABASE||{};
  const url=String(cfg.url||'').replace(/\/+$/,'');
  const key=String(cfg.anonKey||cfg.anon_key||'');
  return url && key ? {url,key} : null;
}

function esc(v){return String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function syncModeUI(){
  document.querySelectorAll('.mode-tab').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===currentMode));
  localBestEl.textContent='LOCAL BEST '+Number(localStorage.getItem(modeKey(currentMode))||0)+'m';
  if(backBtn) backBtn.href='index.html';
}
function fmtTime(v){
  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return '';
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function render(scores){
  if(!scores || !scores.length){ rows.innerHTML='<div class="state">아직 등록된 기록이 없습니다</div>'; return; }
  rows.innerHTML=scores.map((s,i)=>'<div class="row"><div class="rank">#'+(i+1)+'</div><div class="name">'+esc(s.player_name)+'</div><div class="alt">'+Number(s.altitude||0)+'m</div><div class="time">'+esc(fmtTime(s.created_at))+'</div></div>').join('');
}
async function loadScores(){
  const cfg=supabaseSettings();
  if(!cfg){ rows.innerHTML='<div class="state">Supabase 설정 대기 중</div>'; return; }
  try {
    const endpoint=cfg.url+'/rest/v1/leaderboard_scores?select=player_name,altitude,created_at,mode&mode=eq.'+encodeURIComponent(currentMode)+'&order=altitude.desc,created_at.asc&limit=50';
    const res=await fetch(endpoint,{headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,accept:'application/json'}});
    if(!res.ok) throw new Error('request failed');
    render(await res.json());
  } catch (_) {
    rows.innerHTML='<div class="state">랭킹을 불러오지 못했습니다</div>';
  }
}

document.querySelectorAll('.mode-tab').forEach(btn=>btn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  currentMode=btn.dataset.mode==='extreme' ? 'extreme' : 'normal';
  history.replaceState(null,'','?mode='+encodeURIComponent(currentMode));
  syncModeUI();
  loadScores();
}));
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
syncModeUI();
loadScores();
</script>
</body>
</html>
