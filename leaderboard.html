<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SKYHOOK ASCENT LEADERBOARD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Syne:wght@700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#070510; color:#fff;
    font-family:'Syne',sans-serif; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; }
  body { display:block; min-height:100dvh; padding:16px 0;
    background:radial-gradient(ellipse at 50% -10%,rgba(0,200,255,.18),transparent 55%),
      radial-gradient(ellipse at 50% 110%,rgba(156,219,60,.14),transparent 50%),#070510; }
  .shell { display:flex; align-items:stretch; justify-content:center; min-height:calc(100dvh - 32px); }
  .page { width:100vw; min-height:100%; height:calc(100dvh - 32px); position:relative; display:flex; flex-direction:column; overflow:hidden; border:1px solid rgba(0,200,255,.22); padding:70px 14px 18px; --pagew:460px; --pageh:818px; }
  @media (orientation:landscape) {
    .page { width:min(100vw,calc(100vh * 9 / 16)); width:min(100vw,calc(100dvh * 9 / 16));
      height:100vh; height:100dvh; }
  }
  .page::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.2) 3px,transparent 4px); mix-blend-mode:overlay; }
  .back { position:absolute; left:14px; top:14px; z-index:2; width:88px; height:38px; padding:0 12px; white-space:nowrap;
    display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.78);
    background:linear-gradient(135deg, rgba(255,255,255,.94), rgba(242,250,255,.9) 56%, rgba(210,242,255,.92)); color:#0b1020; text-decoration:none; font-family:'Syne',sans-serif;
    font-size:12px; font-weight:800; letter-spacing:0; box-shadow:0 0 18px rgba(255,255,255,.38), inset 0 0 12px rgba(255,255,255,.45); text-shadow:0 0 2px rgba(255,255,255,.55); border-radius:0; }
  .title { font-family:'Syne',sans-serif; font-weight:800; font-size:clamp(22px, calc(var(--pagew) * .09), 42px); line-height:.9;
    letter-spacing:0; text-align:center; margin-bottom:14px; }
  .title .sky { color:#fff; text-shadow:0 0 20px rgba(255,255,255,.72), 0 0 34px rgba(255,255,255,.28); }
  .title .board { color:#00c8ff; text-shadow:0 0 20px #00c8ff, 0 0 36px rgba(0,200,255,.35); }
  .panel { position:relative; z-index:1; margin-top:18px; border:1px solid rgba(0,200,255,.28); background:rgba(7,5,16,.62); box-shadow:0 0 24px rgba(0,200,255,.12), inset 0 0 18px rgba(0,200,255,.06); flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .entry { border-bottom:1px solid rgba(0,200,255,.12); }
  .entry:last-child { border-bottom:0; }
  .row { display:grid; grid-template-columns:minmax(44px,64px) minmax(0,1fr) minmax(58px,74px) minmax(58px,82px); gap:6px; align-items:start; min-height:62px;
    padding:8px 8px 10px; }
  .head { min-height:44px; color:#9fb1c4; font-family:'Syne',sans-serif; font-size:14px; letter-spacing:0; align-items:end; }
  .rank { font-family:'Syne',sans-serif; color:#7CFF00; font-weight:800; font-size:clamp(16px, calc(var(--pagew) * .045), 21px); letter-spacing:0; min-width:0; line-height:1; white-space:nowrap; text-shadow:0 0 10px rgba(124,255,0,.18); }
  .page.mode-extreme .rank { color:#ff2d2d; text-shadow:0 0 10px rgba(255,45,45,.18); }
  .name-cell { min-width:0; display:flex; align-items:center; gap:8px; cursor:pointer; }
  .name { overflow:hidden; text-overflow:ellipsis; font-family:'Noto Sans KR',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:800; font-size:clamp(15px, calc(var(--pagew) * .043), 20px); min-width:0; line-height:1.05; white-space:normal; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; flex:1 1 auto; }
  .name-cell:active .name { opacity:.86; }
  .alt { text-align:right; color:#00c8ff; font-family:'Noto Sans KR',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:900; font-size:clamp(15px, calc(var(--pagew) * .043), 20px); letter-spacing:0; min-width:0; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .time { text-align:right; color:#9fb1c4; font-family:'Noto Sans KR',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:800; font-size:clamp(9px, calc(var(--pagew) * .024), 11px); letter-spacing:0; min-width:0; line-height:1.05; white-space:normal; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .time .date, .time .clock { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .modal { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(7,5,16,.82); backdrop-filter:blur(4px); }
  .modal.open { display:flex; }
  .modal-card { width:min(92vw, 560px); max-height:min(78vh, 680px); overflow:hidden; border:1px solid rgba(0,200,255,.28); background:rgba(7,5,16,.96); box-shadow:0 0 34px rgba(0,200,255,.16), inset 0 0 18px rgba(0,200,255,.06); display:flex; flex-direction:column; }
  .modal-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 12px 10px; border-bottom:1px solid rgba(0,200,255,.12); }
  .modal-name { min-width:0; font-family:'Syne',sans-serif; font-weight:800; font-size:18px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .modal-close { border:1px solid rgba(255,255,255,.78); background:linear-gradient(135deg, rgba(255,255,255,.94), rgba(242,250,255,.9) 56%, rgba(210,242,255,.92)); color:#0b1020; font-family:'Syne',sans-serif; font-weight:800; font-size:11px; padding:8px 10px; cursor:pointer; white-space:nowrap; box-shadow:0 0 14px rgba(255,255,255,.26), inset 0 0 10px rgba(255,255,255,.34); }
  .modal-close:active { transform:scale(.97); }
  .modal-body { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 12px 12px; }
  .detail-list { display:flex; flex-direction:column; gap:8px; }
  .detail-item { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; align-items:center; font-family:'Noto Sans KR',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:12px; line-height:1.1; color:#9fb1c4; padding:6px 0; border-bottom:1px solid rgba(0,200,255,.08); }
  .detail-item:last-child { border-bottom:0; }
  .detail-item .d-alt { color:#00c8ff; font-weight:900; white-space:nowrap; }
  .detail-item .d-time { display:flex; flex-direction:column; align-items:flex-end; gap:1px; white-space:nowrap; }
  .state { padding:24px 14px; text-align:center; color:#9fb1c4; line-height:1.45; font-size:13px; }
  .mode-tabs { margin-top:32px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mode-tab { border:1px solid rgba(0,200,255,.34); background:rgba(7,5,16,.7); color:#9fb1c4;
    font-family:'Syne',sans-serif; font-size:clamp(14px, calc(var(--pagew) * .037), 17px); font-weight:800; letter-spacing:1px; padding:13px 0; cursor:pointer; }
  .mode-tab[data-mode='normal'] { color:#7CFF00; border-color:rgba(124,255,0,.35); }
  .mode-tab[data-mode='extreme'] { color:#ff2d2d; border-color:rgba(255,45,45,.35); }
  .mode-tab.active { color:#070510; }
  .mode-tab[data-mode='normal'].active { background:#7CFF00; border-color:#7CFF00; box-shadow:0 0 18px rgba(124,255,0,.24); }
  .mode-tab[data-mode='extreme'].active { background:#ff2d2d; border-color:#ff2d2d; box-shadow:0 0 18px rgba(255,45,45,.24); }
  .mode-tab:active { transform:scale(.98); }
  .mode-badge { display:inline-flex; align-items:center; justify-content:center; min-width:54px; padding:3px 8px; border-radius:999px;
    font-family:'Syne',sans-serif; font-size:10px; letter-spacing:1px; margin-left:8px; vertical-align:middle; }
  .mode-badge.normal { color:#7CFF00; border:1px solid rgba(124,255,0,.35); box-shadow:0 0 10px rgba(124,255,0,.18); }
  .mode-badge.extreme { color:#ff2d2d; border:1px solid rgba(255,45,45,.35); box-shadow:0 0 10px rgba(255,45,45,.18); }
  .local { margin:8px 0 10px; text-align:center; color:#7CFF00; font-family:'Syne',sans-serif; font-size:clamp(14px, calc(var(--pagew) * .039), 18px); letter-spacing:0; text-shadow:0 0 10px rgba(124,255,0,.18); }
  .page.mode-extreme .local { color:#ff2d2d; text-shadow:0 0 10px rgba(255,45,45,.18); }

  @media (max-width:380px) {
    .page { padding-left:10px; padding-right:10px; }
    .back { width:82px; height:36px; font-size:11px; padding:0 10px; }
    .title { font-size:clamp(20px, calc(var(--pagew) * .085), 32px); }
    .row { grid-template-columns:minmax(42px,52px) minmax(0,1fr) minmax(50px,62px) minmax(52px,68px); gap:4px; padding:8px 5px 10px; }
    .rank,.name,.alt { font-size:14px; }
    .time { font-size:9px; }
    .modal-card { width:min(94vw, 520px); }
    .modal-name { font-size:16px; }
  }
</style>
</head>
<body draggable="false">
  <div class="shell">
  <main class="page">
    <a class="back" id="backBtn" href="index.html" aria-label="back to game">◀ Back</a>
    <h1 class="title"><span class="sky">SKYHOOK</span><br><span class="board">LEADERBOARD</span></h1>
    <div class="mode-tabs" role="tablist" aria-label="leaderboard mode">
      <button class="mode-tab active" data-mode="normal" type="button">NORMAL</button>
      <button class="mode-tab" data-mode="extreme" type="button">EXTREME</button>
    </div>
    <div class="local" id="localBest">LOCAL BEST 0m</div>
    <section class="panel" aria-label="leaderboard"> 
      <div class="row head"><div>RANK</div><div>NAME</div><div>ALT</div><div>TIME</div></div>
      <div id="rankRows"><div class="state">랭킹 서버 설정 대기 중</div></div>
    </section>
    <div class="modal" id="detailModal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="detailName">
        <div class="modal-head">
          <div class="modal-name" id="detailName"></div>
          <button class="modal-close" id="detailClose" type="button">CLOSE</button>
        </div>
        <div class="modal-body" id="detailBody"></div>
      </div>
    </div>
  </main>
  </div>


<script>
function syncPageSizeVars(){
  const page=document.querySelector('.page');
  if(!page) return;
  const rect=page.getBoundingClientRect();
  page.style.setProperty('--pagew', rect.width + 'px');
  page.style.setProperty('--pageh', rect.height + 'px');
}
window.addEventListener('resize',syncPageSizeVars,{passive:true});
window.addEventListener('orientationchange',syncPageSizeVars,{passive:true});
syncPageSizeVars();
</script>
<script src="supabase-config.js"></script>
<script>
const rows=document.getElementById('rankRows');
const params=new URLSearchParams(location.search);
let currentMode=params.get('mode')==='extreme' ? 'extreme' : 'normal';
const modeKey=mode=>mode==='extreme' ? 'skyhook_best_extreme' : 'skyhook_best_normal';
const backBtn=document.getElementById('backBtn');
const localBestEl=document.getElementById('localBest');
const detailModal=document.getElementById('detailModal');
const detailName=document.getElementById('detailName');
const detailBody=document.getElementById('detailBody');
const detailClose=document.getElementById('detailClose');
function supabaseSettings(){
  const cfg=window.SKYHOOK_SUPABASE||{};
  const url=String(cfg.url||'').replace(/\/+$/,'');
  const key=String(cfg.anonKey||cfg.anon_key||'');
  return url && key ? {url,key} : null;
}

function esc(v){return String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function syncModeUI(){
  document.querySelectorAll('.mode-tab').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===currentMode));
  localBestEl.textContent='LOCAL BEST '+Number(localStorage.getItem(modeKey(currentMode))||0)+'m';
  document.querySelector('.page')?.classList.toggle('mode-extreme', currentMode==='extreme');
  document.querySelector('.page')?.classList.toggle('mode-normal', currentMode!=='extreme');
  if(backBtn) backBtn.href='index.html';
}
function fmtTimeParts(v){
  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return {date:'',clock:''};
  const pad=n=>String(n).padStart(2,'0');
  return {
    date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
    clock:`${pad(d.getHours())}:${pad(d.getMinutes())}`
  };
}
function openDetails(name, items){
  if(!detailModal || !detailName || !detailBody) return;
  detailName.textContent=name;
  detailBody.innerHTML='<div class="detail-list">'+items.map(item=>{
    const dt=fmtTimeParts(item.created_at);
    return '<div class="detail-item"><div class="d-alt">'+Number(item.altitude||0)+'m</div><div class="d-time"><span class="date">'+esc(dt.date)+'</span><span class="clock">'+esc(dt.clock)+'</span></div></div>';
  }).join('')+'</div>';
  detailModal.classList.add('open');
  detailModal.setAttribute('aria-hidden','false');
}
function closeDetails(){
  if(!detailModal) return;
  detailModal.classList.remove('open');
  detailModal.setAttribute('aria-hidden','true');
}
function render(scores){
  const list=(scores||[]);
  const grouped=new Map();
  for(const score of list){
    const name=String(score?.player_name||'').trim();
    if(!name) continue;
    const prev=grouped.get(name);
    const alt=Number(score.altitude||0);
    if(!prev){
      grouped.set(name,{ best:score, items:[score] });
    }else{
      prev.items.push(score);
      if(alt > Number(prev.best.altitude||0)) prev.best=score;
    }
  }
  const groups=[...grouped.entries()].map(([name,data])=>({
    name,
    best:data.best,
    items:data.items.slice().sort((a,b)=>Number(b.altitude||0)-Number(a.altitude||0) || new Date(a.created_at)-new Date(b.created_at))
  })).sort((a,b)=>Number(b.best.altitude||0)-Number(a.best.altitude||0) || new Date(a.best.created_at)-new Date(b.best.created_at));
  if(!groups.length){ rows.innerHTML='<div class="state">아직 등록된 기록이 없습니다</div>'; return; }
  rows.innerHTML=groups.map((g,i)=>{
    const t=fmtTimeParts(g.best.created_at);
    return '<div class="entry" data-name="'+esc(g.name)+'"><div class="row"><div class="rank">#'+(i+1)+'</div><div class="name-cell" role="button" tabindex="0" aria-label="'+esc(g.name)+' records"><div class="name">'+esc(g.name)+'</div></div><div class="alt">'+Number(g.best.altitude||0)+'m</div><div class="time"><span class="date">'+esc(t.date)+'</span><span class="clock">'+esc(t.clock)+'</span></div></div></div>';
  }).join('');
  rows.querySelectorAll('.name-cell').forEach(cell=>{
    const entry=cell.closest('.entry');
    const name=entry?.dataset?.name||'';
    const group=groups.find(g=>g.name===name);
    const open=()=>group && openDetails(group.name, group.items);
    cell.addEventListener('click',open);
    cell.addEventListener('keydown',e=>{
      if(e.key==='Enter' || e.key===' ') { e.preventDefault(); open(); }
    });
  });
}
async function loadScores(){
  const cfg=supabaseSettings();
  if(!cfg){ rows.innerHTML='<div class="state">Supabase 설정 대기 중</div>'; return; }
  try {
    const modeFilter = '&mode=eq.'+encodeURIComponent(currentMode);
    const limit = 1000;
    const endpoint=cfg.url+'/rest/v1/leaderboard_scores?select=player_name,altitude,created_at,mode'+modeFilter+'&order=altitude.desc,created_at.asc&limit='+limit;
    const res=await fetch(endpoint,{headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,accept:'application/json'}});
    if(!res.ok) throw new Error('request failed');
    const scores=await res.json();
    render(scores);
  } catch (_) {
    rows.innerHTML='<div class="state">랭킹을 불러오지 못했습니다</div>';
  }
}

document.querySelectorAll('.mode-tab').forEach(btn=>btn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  currentMode=btn.dataset.mode==='extreme' ? 'extreme' : 'normal';
  history.replaceState(null,'','?mode='+encodeURIComponent(currentMode));
  syncModeUI();
  loadScores();
}));
if(detailClose) detailClose.addEventListener('click', closeDetails);
if(detailModal) detailModal.addEventListener('click',e=>{ if(e.target===detailModal) closeDetails(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetails(); });
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
syncModeUI();
loadScores();
</script>
</body>
</html>
