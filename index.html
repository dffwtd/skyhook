<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SKYHOOK ASCENT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Syne:wght@700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#070510;
    font-family:'Chakra Petch',sans-serif; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 110%,rgba(120,200,60,0.14),transparent 50%),

  #stage { position:relative; width:100vw; height:100vh; height:100dvh;
    border:1px solid rgba(0,200,255,0.22);
    box-shadow:0 0 50px rgba(0,200,255,0.12),inset 0 0 90px rgba(120,200,60,0.05);
    background:#070510; overflow:hidden; touch-action:none;
    --hud-scale:1; --start-title-scale:1; --over-title-scale:1; --pause-title-scale:1;
    --btn-scale:1; }
  @media (orientation:landscape) {

      height:100vh; height:100dvh; }

  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }

  .top-alt { padding:calc(5px * var(--hud-scale)) calc(16px * var(--hud-scale)) calc(7px * var(--hud-scale)); min-width:calc(138px * var(--hud-scale)); justify-content:center; }
  .top-alt .value { display:flex; align-items:flex-end; font-size:calc(52px * var(--hud-scale)); line-height:1; letter-spacing:0; color:#fff; text-shadow:0 0 12px rgba(0,200,255,.8), 0 0 22px rgba(156,219,60,.24); }
  .top-alt .unit { font-size:.42em; line-height:1; margin-left:4px; color:#9cdb3c; text-shadow:0 0 12px rgba(156,219,60,.7); }
  #altMeter { position:absolute; right:11px; top:64px; bottom:84px; width:58px; z-index:6;

  .meter-mark { position:absolute; right:0; width:58px; height:0; transform:translateY(50%); }
  .meter-mark::before { content:""; position:absolute; right:18px; top:-1px; width:14px; height:2px;

  .meter-tag { position:absolute; right:35px; top:-9px; min-width:52px; text-align:right;

  .tnt-meter-mark { position:absolute; right:0; width:78px; height:0; transform:translateY(50%); color:#ff3b30; }
  .tnt-meter-mark .tnt-mini { position:absolute; right:14px; top:-14px; width:30px; height:26px; image-rendering:pixelated;
    filter:drop-shadow(0 0 8px rgba(255,59,48,.85)); }
  .tnt-meter-mark .tnt-alt { position:absolute; right:48px; top:-6px; font-size:8px; line-height:1; letter-spacing:0; color:#ff6b61;

  .tnt-meter-mark .tnt-count { position:absolute; right:0; top:-6px; font-size:8px; line-height:1; letter-spacing:0; color:#ffd54a;

  #meterScale { position:absolute; right:35px; top:-5px; font-size:9px; line-height:1;
    color:rgba(159,177,196,.8); letter-spacing:1px; text-align:right; }
  #meterBase { position:absolute; right:35px; bottom:-4px; font-size:9px; line-height:1;
    color:rgba(159,177,196,.65); letter-spacing:1px; }
  .pause-btn { position:absolute; right:14px; top:14px; z-index:12; width:34px; height:34px;
    border:1px solid rgba(0,200,255,.35); background:rgba(7,5,16,.72); color:#fff;
    font-family:'Syne',sans-serif; font-weight:800; font-size:16px; line-height:1; cursor:pointer;
    box-shadow:0 0 16px rgba(0,200,255,.18), inset 0 0 12px rgba(0,200,255,.08); }
  .pause-btn.paused { color:#9cdb3c; border-color:rgba(156,219,60,.5);
    box-shadow:0 0 18px rgba(156,219,60,.25), inset 0 0 12px rgba(156,219,60,.12); }
  .rank-btn { position:absolute; left:14px; top:14px; z-index:12; min-width:34px; height:34px; padding:0 10px;
    border:1px solid rgba(156,219,60,.42); background:rgba(7,5,16,.72); color:#9cdb3c; text-decoration:none;
    display:flex; align-items:center; justify-content:center; gap:6px; font-family:'Syne',sans-serif; font-weight:800;

  .rank-btn:active { transform:scale(.95); }
  .screen { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;

    background:rgba(7,5,16,.82); backdrop-filter:blur(3px); padding:clamp(14px,3.4vh,22px); }
  .hidden { display:none!important; }
  .title { font-family:'Syne',sans-serif; font-weight:800; font-size:calc(clamp(26px,5.2vh,44px) * var(--start-title-scale)); line-height:.9;
    letter-spacing:1px; color:#fff; text-shadow:0 0 20px #00c8ff,0 0 40px rgba(156,219,60,.5);

  .title span { color:#9cdb3c; text-shadow:0 0 20px #9cdb3c; }

    clip-path:polygon(8% 0,100% 0,92% 100%,0 100%); box-shadow:0 0 26px rgba(0,200,255,.7); transition:transform .12s;

  #over .title { font-size:calc(clamp(24px,4.8vh,50px) * var(--over-title-scale)); letter-spacing:calc(clamp(1px,.35vh,3px) * var(--over-title-scale)); color:#fff; transform:skewX(-10deg) scaleY(1.08); text-shadow:0 0 10px rgba(255,255,255,.25), 0 0 18px rgba(255,59,48,.9), 0 0 46px rgba(255,59,48,.55);
    width:min(70vw, 100%); max-width:70vw; overflow-wrap:anywhere; word-break:keep-all; }
  #over .title::before { color:rgba(255,255,255,.14); clip-path:inset(0 0 48% 0); }

  #start .title { font-size:calc(clamp(24px,5.1vh,44px) * var(--start-title-scale)); width:min(70vw, 360px); max-width:70vw; line-height:.88; letter-spacing:0; display:block; margin:0 auto; white-space:nowrap; overflow:visible; overflow-wrap:normal; word-break:normal; }
  #start .title br { display:block; }
  .name-form { width:min(70vw, 300px); max-width:70vw; display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  .mode-select { width:min(70vw, 300px); max-width:70vw; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mode-btn { border:1px solid rgba(0,200,255,.34); background:rgba(7,5,16,.7); color:#9fb1c4;
    font-family:'Syne',sans-serif; font-weight:800; font-size:calc(12px * var(--btn-scale)); letter-spacing:calc(1.5px * var(--btn-scale));
    padding:calc(11px * var(--btn-scale)) 0; cursor:pointer; box-shadow:0 0 16px rgba(0,200,255,.12), inset 0 0 12px rgba(0,200,255,.05); }
  .mode-btn.active { color:#070510; background:#9cdb3c; border-color:#9cdb3c; box-shadow:0 0 22px rgba(156,219,60,.5); }
  .mode-btn:active { transform:scale(.98); }
  .mode-note { font-family:'Syne',sans-serif; font-size:11px; letter-spacing:1px; color:#7e93a8; width:min(70vw, 300px); max-width:70vw; line-height:1.35; }
  .player-name-input { width:100%; border:1px solid rgba(0,200,255,.42); background:rgba(7,5,16,.76); color:#fff;
    font-family:'Syne',sans-serif; font-weight:800; font-size:calc(15px * var(--btn-scale)); letter-spacing:1px;
    text-align:center; padding:calc(12px * var(--btn-scale)) calc(14px * var(--btn-scale)); outline:none;
    box-shadow:0 0 18px rgba(0,200,255,.16), inset 0 0 12px rgba(0,200,255,.08); text-transform:uppercase; }
  .player-name-input:focus { border-color:#9cdb3c; box-shadow:0 0 22px rgba(156,219,60,.24), inset 0 0 12px rgba(156,219,60,.1); }
  .player-name-input::placeholder { color:rgba(159,177,196,.68); }
  .name-error { font-size:11px; line-height:1.2; color:#ff6b61; letter-spacing:1px; text-shadow:0 0 10px rgba(255,59,48,.35); }
  #over .over-score { color:#e8edf4; text-shadow:0 0 12px rgba(255,255,255,.15); }
  #over .over-score b { color:#ff3b30; font-size:calc(44px * var(--over-title-scale)); display:block; text-shadow:0 0 10px rgba(255,59,48,.6), 0 0 20px rgba(255,59,48,.28); }
  #pauseOverlay { background:rgba(0,0,0,.88); }
  #pauseOverlay .title { font-size:calc(clamp(22px,4.8vh,46px) * var(--pause-title-scale)); letter-spacing:calc(clamp(1px,.35vh,4px) * var(--pause-title-scale)); text-shadow:0 0 10px rgba(255,255,255,.22), 0 0 20px rgba(255,59,48,.72);
    width:min(70vw, 100%); max-width:70vw; overflow-wrap:anywhere; word-break:keep-all; }
  #pauseOverlay .pause-note { font-family:'Syne',sans-serif; font-size:calc(clamp(11px,1.7vh,14px) * var(--pause-title-scale)); letter-spacing:calc(clamp(1px,.3vh,3px) * var(--pause-title-scale)); color:#dfe6ff; text-transform:uppercase; width:min(70vw, 100%); max-width:70vw; }
  #pauseOverlay .resume-btn { min-width:min(220px,70vw); width:min(70vw, 280px); }
  #pauseOverlay .resume-btn { background:#ff3b30; color:#fff; box-shadow:0 0 26px rgba(255,59,48,.7); font-size:calc(clamp(12px,1.8vh,16px) * var(--pause-title-scale)); padding:calc(clamp(10px,2vh,13px) * var(--pause-title-scale)) calc(clamp(22px,6vw,40px) * var(--pause-title-scale)); }
  #pauseOverlay .resume-btn:active { transform:scale(.95); }
  .over-rank-btn { display:flex; align-items:center; justify-content:center; text-decoration:none; background:#9cdb3c; color:#070510; box-shadow:0 0 26px rgba(156,219,60,.62); }
  .newbest { color:#9cdb3c; font-weight:800; letter-spacing:3px; text-shadow:0 0 12px #9cdb3c; }
  .hint { font-size:12px; letter-spacing:2px; color:#5d6b80; }

  /* enhanced start screen */
  .badge { font-family:'Syne',sans-serif; font-size:11px; letter-spacing:5px; color:#9cdb3c;
    text-shadow:0 0 10px rgba(156,219,60,.6); opacity:.9;
    border:1px solid rgba(156,219,60,.35); padding:6px 14px; }
  .rule { width:120px; height:2px; background:linear-gradient(90deg,transparent,#00c8ff,transparent);
    box-shadow:0 0 12px #00c8ff; }
  .deco-line { position:absolute; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(0,200,255,.5),transparent); }
  .deco-line.top { top:48px; } .deco-line.bottom { bottom:48px; }
  .ctrl { display:flex; flex-direction:column; gap:6px; font-size:13px; letter-spacing:1px;
    color:#7e93a8; text-align:center; }
  .ctrl b { color:#00c8ff; font-family:'Syne',sans-serif; letter-spacing:2px; margin-right:6px;
    text-shadow:0 0 8px rgba(0,200,255,.6); }
  .title.glitch { position:relative; animation:flick 4s infinite; }
  @keyframes flick { 0%,97%,100%{opacity:1} 98%{opacity:.6} 99%{opacity:.95} }
  .title.glitch::before, .title.glitch::after {
    content:attr(data-text); position:absolute; left:0; top:0; width:100%;
    pointer-events:none; }
  .title.glitch::before { color:#ff3b30; mix-blend-mode:screen;
    animation:gl1 3.2s infinite steps(2); clip-path:inset(0 0 60% 0); }
  .title.glitch::after { color:#00c8ff; mix-blend-mode:screen;
    animation:gl2 2.7s infinite steps(2); clip-path:inset(55% 0 0 0); }
  @keyframes gl1 { 0%,92%,100%{transform:translate(0,0)} 93%{transform:translate(-3px,1px)} 96%{transform:translate(2px,-1px)} }
  @keyframes gl2 { 0%,90%,100%{transform:translate(0,0)} 91%{transform:translate(3px,-1px)} 95%{transform:translate(-2px,1px)} }
  .btn { animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 26px rgba(0,200,255,.7)} 50%{box-shadow:0 0 40px rgba(0,200,255,1)} }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="topHud" aria-hidden="true">
      <div class="top-chip top-alt"><span class="value"><span class="num" id="topHeightNum">0</span><span class="unit">m</span></span></div>
    </div>
    <button class="pause-btn" id="pauseBtn" aria-label="pause game"></button>
    <a class="rank-btn rank-link" id="rankBtn" href="leaderboard.html" aria-label="open leaderboard">RANK</a>
    <div id="altMeter" aria-hidden="true">
      <div id="meterScale">200m</div>
      <div class="meter-track"><div id="altFill"></div></div>
      <div class="meter-mark" id="meterBest"><div class="meter-tag" id="meterBestText">0m</div></div>
      <div class="meter-mark" id="meterNow"><div class="meter-tag" id="meterNowText">0m</div></div>
      <div class="meter-mark" id="meterGas"><div class="meter-tag" id="meterGasText">GAS</div></div>
      <div id="meterTnt" aria-hidden="true"></div>
      <div id="meterBase">0m</div>
    </div>

    <div id="start" class="screen">
      <div class="title glitch" data-text="SKYHOOK">SKYHOOK<br><span>ASCENT</span></div>
      <div class="mode-select" id="modeSelect" role="tablist" aria-label="game mode">
        <button class="mode-btn active" id="modeNormal" data-mode="normal" type="button">NORMAL</button>
        <button class="mode-btn" id="modeExtreme" data-mode="extreme" type="button">EXTREME</button>
      </div>
      <div class="name-form" id="nameForm">
        <input class="player-name-input" id="playerNameInput" maxlength="16" autocomplete="nickname" placeholder="NAME" aria-label="player name">
        <div class="name-error hidden" id="nameError">이름을 입력해줘</div>
      </div>
      <div class="mode-note" id="modeNote">NORMAL은 지금 속도, EXTREME은 2배 속도</div>
      <button class="btn" id="startBtn" type="button">START ▲</button>
    </div>

    <div id="over" class="screen hidden">
      <div class="title glitch" data-text="WASTED">WASTED</div>
      <div class="over-score">ALTITUDE<b id="finalAlt">0</b></div>
      <div id="bestMsg" class="hint"></div>
      <button class="btn" id="retryBtn">RETRY ▲</button>
      <a class="btn over-rank-btn rank-link" href="leaderboard.html">RANKING</a>
    </div>
    <div id="pauseOverlay" class="screen hidden">
      <div class="title glitch" data-text="PAUSED">PAUSED</div>
      <div class="pause-note">일시정지 중</div>
      <button class="btn resume-btn" id="resumeBtn">일시정지 해제</button>
    </div>
  </div>
</div>

<script>
const cv=document.getElementById('game'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
let W=460,H=818,dpr=1;
function resize(){
  const r=stage.getBoundingClientRect();
  W=r.width; H=r.height;
  updateUiScale();
  dpr=Math.min(window.devicePixelRatio||1, perf.dprCap);
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
}
window.addEventListener('resize',resize);
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
const perf={quality:1,dprCap:1.75,starCount:70,rainCount:48,gasCount:8,layerSkip:1,particleCap:220,trailCap:12,fx:1};
function updateUiScale(){
  const widthScale=W/460;
  const heightScale=H/818;
  const base=Math.max(0.58,Math.min(1,widthScale,heightScale));
  const mobile=Math.min(W,H) < 600;
  perf.quality=base;
  perf.dprCap=mobile ? 1 : 1.45;
  perf.starCount=mobile ? 14 : 46;
  perf.rainCount=mobile ? 10 : 30;
  perf.gasCount=mobile ? 4 : 8;
  perf.layerSkip=1;
  perf.particleCap=mobile ? 80 : 160;
  perf.trailCap=mobile ? 5 : 9;
  perf.fx=mobile ? 0.38 : 0.8;
  const startScale=Math.max(0.68,Math.min(1,base*0.92));
  const overScale=Math.max(0.36,Math.min(0.82,base*0.68));
  const pauseScale=Math.max(0.38,Math.min(0.78,base*0.64));
  const btnScale=Math.max(0.62,Math.min(0.84,base*0.88));
  stage.style.setProperty('--hud-scale',Math.max(0.62,Math.min(0.9,base*0.78)));
  stage.style.setProperty('--start-title-scale',startScale);
  const startTitle=document.querySelector('#start .title');
  if(startTitle){ startTitle.style.transform='scale(1)'; }
  stage.style.setProperty('--over-title-scale',overScale);
  stage.style.setProperty('--pause-title-scale',pauseScale);
  stage.style.setProperty('--btn-scale',btnScale);
}

const AudioCtor=window.AudioContext||window.webkitAudioContext;
const tntSprite=new Image();
tntSprite.src='tnt.png';
const audio={ctx:null,master:null,sfxGain:null};
function pauseIcon(paused){
  return paused
    ? '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 5h3v14H8V5Zm5 0 8 7-8 7V5Z"/></svg>'
    : '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>';
}
function syncPauseButton(){
  const btn=document.getElementById('pauseBtn');
  if(!btn) return;
  const paused=state==='pause';
  btn.classList.toggle('paused',paused);
  btn.innerHTML=pauseIcon(paused);
  btn.setAttribute('aria-label',paused?'resume game':'pause game');
}
function ensureAudio(){
  if(!AudioCtor) return null;
  if(!audio.ctx){
    audio.ctx=new AudioCtor();
    audio.master=audio.ctx.createGain();
    audio.sfxGain=audio.ctx.createGain();
    audio.master.gain.value=0.8;
    audio.sfxGain.gain.value=0.72;
    audio.sfxGain.connect(audio.master);
    audio.master.connect(audio.ctx.destination);
  }
  return audio.ctx;
}
function resumeAudio(){
  if(!ensureAudio()) return;
  if(audio.ctx.state==='suspended') audio.ctx.resume();
}
function sfx(kind){
  if(!ensureAudio()) return;
  if(audio.ctx.state==='suspended') audio.ctx.resume();
  const t=audio.ctx.currentTime;
  const mk=(freq,dur,type,gain,dest)=>{
    const o=audio.ctx.createOscillator();
    const g=audio.ctx.createGain();
    o.type=type;
    o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(dest||audio.sfxGain);
    o.start(t);
    o.stop(t+dur+0.03);
  };
  if(kind==='hook'){
    mk(920,0.05,'square',0.04);
    mk(1360,0.04,'triangle',0.025);
  } else if(kind==='release'){
    mk(340,0.05,'triangle',0.03);
  } else if(kind==='explode'){
    mk(120,0.22,'sawtooth',0.14);
    mk(62,0.30,'sine',0.18);
    const buffer=audio.ctx.createBuffer(1,Math.floor(audio.ctx.sampleRate*0.24),audio.ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++){
      const env=1-i/data.length;
      data[i]=(Math.random()*2-1)*env*0.85;
    }
    const src=audio.ctx.createBufferSource();
    const g=audio.ctx.createGain();
    g.gain.value=0.6;
    src.buffer=buffer;
    src.connect(g).connect(audio.sfxGain);
    src.start(t);
  }
}

function playWastedSting(){
  if(!ensureAudio()) return;
  if(audio.ctx.state==='suspended') audio.ctx.resume();
  const t=audio.ctx.currentTime;
  const mk=(from,to,dur,type,gain,delay=0)=>{
    const o=audio.ctx.createOscillator();
    const g=audio.ctx.createGain();
    o.type=type;
    o.frequency.setValueAtTime(from,t+delay);
    o.frequency.exponentialRampToValueAtTime(Math.max(24,to),t+delay+dur);
    g.gain.setValueAtTime(0.0001,t+delay);
    g.gain.exponentialRampToValueAtTime(gain,t+delay+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+delay+dur);
    o.connect(g).connect(audio.sfxGain);
    o.start(t+delay);
    o.stop(t+delay+dur+0.05);
  };
  mk(140,58,1.12,'sine',0.16,0);
  mk(92,42,1.35,'triangle',0.11,0.03);
  mk(240,150,0.58,'sawtooth',0.07,0.12);
  mk(520,180,0.18,'square',0.03,0.16);
  mk(212,52,1.05,'triangle',0.08,0.02);
}

function reset(){
  // y decreases upward. start standing on a platform.
  // platform sits at world y = 0; player stands on top of it.
  platform={ x: W*0.5-70, y: 0, w: 140, h: 26 };
  player={ x:W*0.5, y: platform.y - 12, vx:0, vy:0, r:12, trail:[], faceMul:1, onGround:true };
  anchors=[]; hazards=[]; particles=[]; explosions=[];
  camY=-(H*0.62); altitude=0; frame=0; deathTimer=0; wallGrace=0;
  rope.active=false; rope.prevSpeed=0; rope.spin=1; rope.turns=0;
  best=Number(lsGet(bestKey(scoreMode()))||0);
  topMost=0; started=false; fogArmed=false;
  // hazards begin early and keep pressure on the route.
  nextHazardAlt = 140 + Math.random()*90;
  // seed anchors upward with a randomized opening so the route doesn't repeat.
  lastAnchorY=-110;
  const seedCount=4;
  const seedXs=[0.18,0.34,0.66,0.82];
  for(let i=0;i<seedCount;i++){
    const y=-130-i*155 + Math.random()*22;
    const x=W*(seedXs[i] + (Math.random()*0.06-0.03));
    anchors.push({x:Math.max(28,Math.min(W-28,x)), y, r:8});
    lastAnchorY=y;
  }
  // make sure the route continues beyond the opening.
  for(let i=seedCount;i<46;i++) addAnchor();
}

function addAnchor(){
  const gap=155+Math.random()*120;
  const y=lastAnchorY-gap;
  const edgeRoll=Math.random();
  let x;
  if(edgeRoll < 0.12){
    x = edgeRoll < 0.06 ? 26 + Math.random()*22 : W - 26 - Math.random()*22;
  } else {
    const lanes=[0.22,0.34,0.48,0.62,0.78];
    const lane=lanes[Math.floor(Math.random()*lanes.length)];
    x=W*lane + (Math.random()*36-18);
  }
  const minX=22, maxX=W-22;
  x=Math.max(minX,Math.min(maxX,x));
  if(anchors.length){
    const prev=anchors[anchors.length-1];
    const dx=Math.abs(prev.x-x);
    if(dx<42){
      x += x < W*0.5 ? -42 : 42;
      x=Math.max(minX,Math.min(maxX,x));
    }
  }
  anchors.push({x,y,r:8});
  if(Math.random()<0.06){
    const ox=Math.max(minX,Math.min(maxX,x+(Math.random()<0.5?-1:1)*(34+Math.random()*22)));
    anchors.push({x:ox,y:y-(18+Math.random()*18),r:8});
  }
  if(Math.random()<0.12){
    const ex = Math.random()<0.5 ? 18 + Math.random()*18 : W - 18 - Math.random()*18;
    anchors.push({x:Math.max(minX,Math.min(maxX,ex)),y:y-(14+Math.random()*16),r:8});
  }
  lastAnchorY=y;
  return y;
}

function press(){
  if(state==='start'){startGame();return;}
  if(state==='over')return;
  started=true;
  // if standing on platform, hop off so a grapple can grab
  if(player.onGround){ player.vy=-6.5; player.onGround=false; }
  let bestA=null,bestD=Infinity;
  for(const a of anchors){
    const dx=a.x-player.x, dy=a.y-player.y, d=Math.hypot(dx,dy);
    if(d<400){
      // strongly prefer anchors above the player so you keep climbing
      const above = a.y < player.y - 10;
      const sc = d + (above ? 0 : 220);
      if(sc<bestD){bestD=sc;bestA=a;}
    }
  }
  if(bestA){
    rope.active=true; rope.ax=bestA.x; rope.ay=bestA.y;
    const dx=player.x-bestA.x, dy=player.y-bestA.y;
    const hookDist=Math.hypot(dx,dy);
    rope.baseLen=Math.max(72,hookDist);
    rope.len=rope.baseLen*1.18;
    rope.angle=Math.atan2(dy,dx);
    const tx=-Math.sin(rope.angle), ty=Math.cos(rope.angle);
    const tangentSpeed=player.vx*tx+player.vy*ty;
    rope.spin=Math.abs(tangentSpeed)>0.6 ? Math.sign(tangentSpeed) : (player.x>=bestA.x ? 1 : -1);
    const startSpeed=Math.max(6.8,Math.min(12.8,Math.abs(tangentSpeed)));
    rope.omega=rope.spin*startSpeed/rope.len;
    rope.prevSpeed=Math.abs(rope.omega*rope.len);
    rope.turns=0;
    wallGrace=20;
    burst(bestA.x,bestA.y,'#00c8ff',6);
  }
}
function release(){
  if(rope.active){
    const tx=-Math.sin(rope.angle), ty=Math.cos(rope.angle);
    const speed=Math.hypot(player.vx,player.vy);
    const stretch=Math.max(0,rope.len-rope.baseLen);
    const turnBoost=1+rope.turns*0.55;
    const launch=Math.min(2.0,1 + speed*0.045 + stretch*0.0045 + rope.turns*0.16);
    player.vx=player.vx*launch;
    player.vy=player.vy*launch;
    if(player.vy > -1.2){
      const lift=Math.min(38, 8 + speed*0.62 + stretch*0.06 + rope.turns*3.0);
      player.vy -= lift*turnBoost;
      player.vx += tx*lift*0.30*turnBoost;
    }
  }
  rope.active=false;
  // release keeps the current tangent velocity from the rope swing
}

function makeHazard(spawnAlt){
  const baseAlt=spawnAlt==null ? altitude : spawnAlt;
  const difficulty=Math.min(1,baseAlt/1600);
  const size=50;
  const side=Math.random()<0.5;
  const edgeBias=Math.random()<0.62;
  const x=edgeBias
    ? (side ? 10+Math.random()*46 : W-60-Math.random()*46)
    : (W*(0.22+Math.random()*0.56) + (Math.random()*36-18));
  const centerY=spawnAlt==null ? camY - 87 - Math.random()*190 : -spawnAlt*12 + (Math.random()*48-24);
  const y=centerY-size*0.5;
  const vx=(Math.random()<0.5?-1:1)*(0.95+difficulty*1.65+Math.random()*0.45);
  return {type:'tnt',x,y,w:size,h:size,vx,phase:Math.random()*Math.PI*2,fuse:Math.random(),tilt:(Math.random()*0.16-0.08),bob:Math.random()*Math.PI*2,spark:Math.random()*Math.PI*2};
}

function drawHazard(h){
  const pulse=(Math.sin(frame*0.16+h.phase*3)*0.5+0.5);
  const fusePulse=(Math.sin(frame*0.56+h.phase*5)*0.5+0.5);
  const bob=Math.sin(frame*0.07+h.bob)*2.2;
  const sway=Math.sin(frame*0.05+h.phase)*h.tilt;
  ctx.save();
  const cx=h.x+h.w/2, cy=h.y+h.h/2+bob;
  ctx.translate(cx,cy);
  ctx.rotate(sway);
  ctx.translate(-cx,-cy);
  const bw=h.w, bh=h.h;
  const bx=h.x, by=h.y+bob;
  const edgeBump=Math.sin(frame*0.11+h.phase*2)*2;
  ctx.shadowColor='#ff3b30';
  ctx.shadowBlur=(18+pulse*18)*perf.fx;
  if(tntSprite.complete && tntSprite.naturalWidth){
    ctx.drawImage(tntSprite,bx-2,by-2,bw+4,bh+4);
    ctx.restore();
    return;
  }
  // main body with a slightly irregular silhouette
  ctx.fillStyle='#c12218';
  ctx.beginPath();
  ctx.moveTo(bx+5,by+6);
  ctx.lineTo(bx+bw-7,by+4+edgeBump*0.2);
  ctx.lineTo(bx+bw-5,by+bh-8);
  ctx.lineTo(bx+7,by+bh-5);
  ctx.closePath();
  ctx.fill();
  // top cap and bottom lip
  ctx.fillStyle='#d93a2e';
  ctx.beginPath();
  ctx.moveTo(bx+6,by+1);
  ctx.lineTo(bx+bw-8,by+2);
  ctx.lineTo(bx+bw-5,by+11);
  ctx.lineTo(bx+4,by+10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#9f2218';
  ctx.fillRect(bx+4,by+bh-11,bw-8,5);
  // face label
  ctx.fillStyle='#ffdf62';
  ctx.fillRect(bx+6,by+16,bw-12,12);
  ctx.fillStyle='#2a0910';
  ctx.font='900 12px Syne, sans-serif'; ctx.textAlign='center';
  ctx.fillText('TNT',cx,cy+5);
  // side seams
  ctx.fillStyle='rgba(255,255,255,.14)';
  ctx.fillRect(bx+4,by+5,3,bh-10);
  ctx.fillRect(bx+bw-7,by+5,3,bh-10);
  ctx.fillStyle='rgba(255,255,255,.22)';
  ctx.fillRect(bx+6,by+6,bw-12,4);
  // fuse and sparks
  ctx.strokeStyle='#ffb020'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(bx+bw-6,by+8); ctx.quadraticCurveTo(bx+bw+8,by-10,bx+bw+20,by-4); ctx.stroke();
  ctx.shadowColor='#fff3a0'; ctx.shadowBlur=(12+fusePulse*16)*perf.fx;
  ctx.fillStyle=fusePulse>0.55?'#fff3a0':'#ffb020';
  ctx.fillRect(bx+bw+18,by-5,6,6);
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffd54a';
  ctx.fillRect(bx+bw+18+Math.cos(frame*0.55+h.phase)*2,by-6-Math.sin(frame*0.42+h.phase)*2,2,2);
  ctx.fillRect(bx+bw+14+Math.sin(frame*0.36+h.phase)*2,by-2,2,2);
  ctx.fillRect(bx+bw+21+Math.sin(frame*0.21+h.phase*2)*2,by-1,2,2);
  ctx.restore();
}

function update(){
  if(state==='pause') return;
  frame++;
  if(state==='play'){
    const S=speed();
    // stand on platform until first action
    if(player.onGround && !started){
      player.y = platform.y - 12; player.vy=0;
    } else {
      if(rope.active){
        // While held, the player is locked to the rope radius and advances by
        // angular velocity. Releasing preserves the tangent velocity below.
        const gravityTangential=GRAV*Math.cos(rope.angle)/rope.len;
        const turnBoost=1+rope.turns*0.10;
        const targetOmega=rope.spin*((12.4*turnBoost + rope.turns*0.28 + rope.prevSpeed*0.03))/rope.len;
        rope.omega += ((targetOmega-rope.omega)*0.15 + gravityTangential*0.50)*S;
        const maxOmega=((15.6 + rope.turns*0.42 + rope.prevSpeed*0.02))/rope.len;
        rope.omega=Math.max(-maxOmega,Math.min(maxOmega,rope.omega));

        const speed=Math.abs(rope.omega*rope.len);
        const speedGain=Math.max(0,speed-rope.prevSpeed);
        rope.prevSpeed=speed;
        rope.turns += Math.abs(rope.omega)/(Math.PI*2);
        const stretch=((rope.turns*rope.turns*44) + (rope.turns*92) + (speed-4.5)*2.8 + speedGain*3.2);
        const targetLen=rope.baseLen + Math.max(0,stretch);
        rope.len += (targetLen-rope.len)*0.18;
        rope.angle += rope.omega*S;

        const tx=-Math.sin(rope.angle), ty=Math.cos(rope.angle);
        const tangentSpeed=rope.omega*rope.len;
        player.x=rope.ax+Math.cos(rope.angle)*rope.len;
        player.y=rope.ay+Math.sin(rope.angle)*rope.len;
        player.vx=tx*tangentSpeed;
        player.vy=ty*tangentSpeed;

        const safeL=player.r+3, safeR=W-player.r-3;
        if(player.x<safeL || player.x>safeR){
          const wallX=player.x<safeL ? safeL : safeR;
          const dy=player.y-rope.ay;
          const dx=wallX-rope.ax;
          rope.len=Math.max(rope.len,Math.hypot(dx,dy));
          rope.angle=Math.atan2(dy,dx);
          rope.omega=-rope.omega*0.86;
          rope.spin*=-1;
          player.x=rope.ax+Math.cos(rope.angle)*rope.len;
          player.y=rope.ay+Math.sin(rope.angle)*rope.len;
          player.vx*=-0.35;
          player.vy*=0.35;
        }
      } else {
        player.vy+=GRAV*S;
        player.x+=player.vx*S; player.y+=player.vy*S;
        player.vx*=0.995; player.vy*=0.9975;
      }
    }
    if(player.vx>0.2)player.faceMul=1; else if(player.vx<-0.2)player.faceMul=-1;

    // bounce off side walls instead of dying or clamping hard.
    if(wallGrace>0) wallGrace--;
    if(!rope.active){
      if(player.x<player.r){
        player.x=player.r;
        player.vx=Math.abs(player.vx)*0.65;
      }
      else if(player.x>W-player.r){
        player.x=W-player.r;
        player.vx=-Math.abs(player.vx)*0.65;
      }
    }

    // platform collision (land back on it if falling onto it)
    if(player.vy>0 && !rope.active &&
       player.x>platform.x-player.r && player.x<platform.x+platform.w+player.r &&
       player.y+player.r>platform.y && player.y+player.r<platform.y+platform.h+12){
      player.y=platform.y-player.r; player.vy=0; player.vx*=0.8; player.onGround=true;
    } else if(player.y < platform.y-40){ player.onGround=false; }

    // Camera follows climbs and also drops when a missed hook sends the player downward.
    const targetCam=player.y - H*0.55;
    if(targetCam<camY){
      camY += (targetCam-camY)*0.14*S;
    }else if(!rope.active && player.vy>1.2 && targetCam>camY){
      camY += Math.min(targetCam-camY, H*0.035*S);
    }

    if(player.y<topMost) topMost=player.y;
    altitude=Math.max(0,Math.floor(-topMost/12));

    // spawn deadly hazards more densely as altitude climbs.
    while(altitude + 500 >= nextHazardAlt){
      const spawnAlt=nextHazardAlt;
      const difficulty=Math.min(1,spawnAlt/1800);
      const count=1 + (spawnAlt>300?1:0) + (spawnAlt>800 && Math.random()<0.65?1:0) + (spawnAlt>1400 && Math.random()<0.5?1:0);
      for(let i=0;i<count;i++) hazards.push(makeHazard(spawnAlt));
      nextHazardAlt += 95 + Math.random()*Math.max(32,110-difficulty*70);
    }

    // generate anchors above
    while(lastAnchorY > -(altitude+500)*12) addAnchor();
    anchors=anchors.filter(a=>a.y < camY+H+140);
    for(const h of hazards){
      if(h.vx){
        const wobble=Math.sin(frame*0.07+h.phase)*0.72;
        h.x+=(h.vx+wobble)*S;
        if(h.x<8||h.x>W-8-h.w)h.vx*=-1;
      }
    }
    hazards=hazards.filter(h=>h.y < camY+H+140);


    // death: touch the rising fog, or collide with a hazard.
    if(deathTimer>0){
      deathTimer--;
      camY -= Math.sin(deathTimer*1.35)*7.8*S;
      camY += (Math.random()*18-9)*S;
      if(deathTimer%2===0) camY += Math.sin(frame*2.4)*4.5*S;
      if(deathTimer===0) gameOver();
    }
    else if(started && player.y > fogLineY()){ gameOver(); }
    else {
      for(const h of hazards){
        if(player.x+player.r>h.x+4 && player.x-player.r<h.x+h.w-4 &&
           player.y+player.r>h.y+4 && player.y-player.r<h.y+h.h-4){
          hitHazard(h);
          break;
        }
      }
    }

    player.trail.push({x:player.x,y:player.y});
    if(player.trail.length>perf.trailCap)player.trail.shift();
  }
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;}
  particles=particles.filter(p=>p.life>0);
  for(const e of explosions)e.life--;
  explosions=explosions.filter(e=>e.life>0);
}

// fog deadly line in world-y: starts well below the platform, only rises once you launch
let fogStartFrame=0, fogArmed=false;
function fogLineY(){
  if(started && !fogArmed){ fogArmed=true; fogStartFrame=frame; }
  if(!fogArmed) return 460; // safely below platform (player stands at y=-12)
  const elapsed=frame-fogStartFrame;
  // rises FAST — keep climbing or it catches you
  return 460 - elapsed*2.6 - altitude*2.0;
}

// ---- pixel character drawing (drawn in screen space after translate) ----
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
function drawHero(wx,wy,face){
  const s=2.6; // pixel scale
  const ox=wx-Math.round(5*s), oy=wy-Math.round(7*s);
  ctx.save();
  if(face<0){ ctx.translate(wx,0); ctx.scale(-1,1); ctx.translate(-wx,0); }
  // glow
  ctx.shadowColor='#00e0ff'; ctx.shadowBlur=14*perf.fx;
  // palette
  const skin='#ffce9e', hair='#1a1a22', coat='#1e2740', coat2='#2c3a63',
        scarf='#ff3b30', arm='#00c8ff', boot='#11141f', visor='#9cdb3c';
  // helper grid cell
  const C=(cx,cy,c,cw=1,ch=1)=>px(ox+cx*s,oy+cy*s,Math.ceil(cw*s),Math.ceil(ch*s),c);
  ctx.shadowBlur=10*perf.fx;
  // head
  C(3,0,hair,4,1); C(2,1,hair,1,2); C(3,1,skin,3,2); C(6,1,hair,1,2);
  C(4,1,visor,2,1); // visor
  // scarf
  C(2,3,scarf,5,1);
  // torso coat
  C(2,4,coat,5,3); C(3,4,coat2,3,1);
  // cyber arm (raised, grappling side)
  C(6,3,arm,1,1); C(7,2,arm,1,1); C(7,1,arm,1,1);
  // other arm
  C(1,4,coat,1,2);
  // legs
  C(3,7,coat2,1,2); C(5,7,coat2,1,2);
  // boots
  C(3,9,boot,1,1); C(5,9,boot,1,1);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(0,-camY);

  const worldTop=camY, worldBot=camY+H;
  const zone = altitude < 420 ? { accent:'#00c8ff' } : altitude < 960 ? { accent:'#9cdb3c' } : { accent:'#ffb020' };

  // --- altitude-based sky gradient ---
  ctx.restore();
  const t=Math.min(1,altitude/1200);
  const sun=Math.min(1,Math.max(0,(altitude-420)/1100));
  const mix=(a,b)=>Math.round(a+(b-a)*t);
  const skyTop=[mix(18,230), mix(26,242), mix(54,252)];
  const skyMid=[mix(10,206), mix(16,232), mix(40,248)];
  const skyBot=[mix(5,170), mix(10,210), mix(26,238)];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgb('+skyTop[0]+','+skyTop[1]+','+skyTop[2]+')');
  g.addColorStop(0.45,'rgb('+skyMid[0]+','+skyMid[1]+','+skyMid[2]+')');
  g.addColorStop(1,'rgb('+skyBot[0]+','+skyBot[1]+','+skyBot[2]+')');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const sunGlow=ctx.createRadialGradient(W*0.52, -H*0.05, H*0.05, W*0.52, -H*0.05, H*0.95);
  sunGlow.addColorStop(0,'rgba(255,248,220,'+(0.32+sun*0.22)+')');
  sunGlow.addColorStop(0.25,'rgba(255,224,160,'+(0.16+sun*0.12)+')');
  sunGlow.addColorStop(0.7,'rgba(255,255,255,0)');
  ctx.fillStyle=sunGlow;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalAlpha=0.08+sun*0.12;
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,W,6);
  ctx.restore();

  // stars (screen-space, twinkling, denser up high)
  for(let i=0;i<perf.starCount;i++){
    const sx=(Math.sin(i*91.3)*0.5+0.5)*W;
    const sy=(Math.sin(i*53.7)*0.5+0.5)*H*0.85;
    const tw=Math.sin(frame*0.04+i)*0.5+0.5;
    ctx.globalAlpha=(0.25+tw*0.55)*(0.4+t*0.6);
    ctx.fillStyle= i%7===0 ? '#9fe8ff' : '#dfe6ff';
    const r=i%11===0?1.6:1;
    ctx.fillRect(sx,sy,r,r);
  }
  ctx.globalAlpha=1;

  ctx.save();
  ctx.translate(0,-camY);

  const worldTop2=camY, worldBot2=camY+H;

  // --- orbital ascent shaft: abstract industrial depth, same neon mood ---
  function ascentShaft(){
    const par=0.32, period=520, scroll=camY*par;
    for(let row=-1;row<H/period+3;row++){
      if(perf.layerSkip>1 && row%perf.layerSkip) continue;
      const seed=Math.floor((scroll+row*period)/period);
      const y=worldTop2 - (scroll%period) + row*period;
      ctx.save();
      ctx.globalAlpha=0.22;
      ctx.strokeStyle=zone.accent; ctx.lineWidth=2; ctx.shadowColor=zone.accent; ctx.shadowBlur=14*perf.fx;
      ctx.beginPath();
      ctx.ellipse(W*0.5,y+110,W*0.54,54,0,0,Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha=0.1; ctx.lineWidth=12;
      ctx.beginPath(); ctx.ellipse(W*0.5,y+110,W*0.54,54,0,0,Math.PI*2); ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha=0.26;
      ctx.strokeStyle='rgba(160,220,255,0.38)'; ctx.lineWidth=1.5;
      for(let i=0;i<7;i++){
        const x=W*(0.08+i*0.14);
        ctx.beginPath(); ctx.moveTo(x,y-90); ctx.lineTo(W*0.5+(x-W*0.5)*0.36,y+period+90); ctx.stroke();
      }
      ctx.restore();
    }
  }
  ascentShaft();

  function sideMachinery(){
    const par=0.68, period=300, scroll=camY*par;
    for(let row=-1;row<H/period+3;row++){
      if(perf.layerSkip>1 && row%perf.layerSkip) continue;
      const seed=Math.floor((scroll+row*period)/period);
      const y=worldTop2 - (scroll%period) + row*period;
      for(const side of [-1,1]){
        const wide=42+Math.abs(Math.sin(seed*2.7+side))*34;
        const x=side<0?0:W-wide;
        ctx.save();
        ctx.globalAlpha=0.82;
        ctx.fillStyle='rgba(6,9,22,0.86)';
        ctx.fillRect(x,y,wide,period+8);
        ctx.fillStyle='rgba(34,43,68,0.72)';
        ctx.fillRect(side<0?x+wide-12:x,y+24,12,period-48);
        ctx.fillStyle=zone.accent;
        ctx.globalAlpha=0.28;
        ctx.fillRect(side<0?x+wide-3:x,y,3,period+8);
        ctx.globalAlpha=0.62;
        for(let p=0;p<4;p++){
          const yy=y+38+p*58+Math.sin(frame*0.035+seed+p)*4;
          ctx.fillStyle=p%2?'rgba(0,200,255,0.45)':'rgba(156,219,60,0.45)';
          ctx.fillRect(side<0?x+wide-24:x+12,yy,12,8);
        }
        ctx.restore();
      }
    }
  }
  sideMachinery();

  function holoPanels(){
    const par=0.5, period=460, scroll=camY*par;
    for(let row=-1;row<H/period+3;row++){
      if(perf.layerSkip>1 && row%perf.layerSkip) continue;
      const seed=Math.floor((scroll+row*period)/period);
      const y=worldTop2 - (scroll%period) + row*period;
      const side=seed%2===0?-1:1;
      const x=side<0?W*0.15:W*0.62;
      ctx.save();
      ctx.globalAlpha=0.58;
      ctx.shadowColor=zone.accent; ctx.shadowBlur=16*perf.fx; ctx.strokeStyle=zone.accent; ctx.lineWidth=2;
      ctx.strokeRect(x,y+72,106,46);
      ctx.shadowBlur=0; ctx.fillStyle='rgba(5,8,20,0.6)'; ctx.fillRect(x+4,y+76,98,38);
      ctx.fillStyle=zone.accent;
      for(let i=0;i<5;i++) ctx.fillRect(x+12,y+86+i*6,56+Math.sin(seed+i)*24,2);
      ctx.restore();
    }
  }
  holoPanels();

  function dataRain(){
    ctx.save();
    ctx.globalAlpha=0.22;
    ctx.fillStyle=zone.accent;
    for(let i=0;i<perf.rainCount;i++){
      const x=(Math.sin(i*17.91)*0.5+0.5)*W;
      const y=((i*73 + frame*2.2 + camY*0.28)%H+H)%H;
      const h=8+(i%5)*5;
      ctx.fillRect(x,y,1,h);
    }
    ctx.restore();
  }
  dataRain();

  function mapFeatureLayer(){
    const par=0.58, period=380, scroll=camY*par;
    for(let row=-1;row<H/period+3;row++){
      if(perf.layerSkip>1 && row%perf.layerSkip) continue;
      const seed=Math.floor((scroll+row*period)/period);
      const y=worldTop2 - (scroll%period) + row*period;
      ctx.save();
      ctx.globalAlpha=0.48;
      ctx.shadowColor=zone.accent; ctx.shadowBlur=14*perf.fx;
      ctx.strokeStyle=zone.accent; ctx.lineWidth=2;
      for(let i=0;i<4;i++){
        const x=W*(0.16+i*0.22)+Math.sin(seed+i)*18;
        ctx.beginPath(); ctx.moveTo(x,y+18); ctx.lineTo(x+22,y+58); ctx.lineTo(x-8,y+96); ctx.stroke();
      }
      ctx.fillStyle='rgba(5,8,20,0.42)';
      ctx.fillRect(W*0.18,y+100,W*0.64,38);
      ctx.fillStyle=zone.accent;
      ctx.fillRect(W*0.18,y+100,W*0.64,2);
      ctx.restore();
    }
  }
  mapFeatureLayer();

  // starting platform (a scrap-metal ledge in the landfill)
  if(platform.y < camY+H+40){
    ctx.save();
    ctx.shadowColor='#00c8ff'; ctx.shadowBlur=12*perf.fx;
    ctx.fillStyle='#2a3145';
    ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
    ctx.shadowBlur=0;
    // neon edge strip
    ctx.fillStyle='#00c8ff';
    ctx.fillRect(platform.x, platform.y, platform.w, 3);
    // rivets / hazard stripes
    ctx.fillStyle='#9cdb3c';
    for(let sx=platform.x+6; sx<platform.x+platform.w-6; sx+=18){
      ctx.fillRect(sx, platform.y+platform.h-6, 9, 3);
    }
    // support legs fading down
    ctx.fillStyle='rgba(42,49,69,0.5)';
    ctx.fillRect(platform.x+16, platform.y+platform.h, 8, 60);
    ctx.fillRect(platform.x+platform.w-24, platform.y+platform.h, 8, 60);
    ctx.restore();
  }

  // anchors (hook points: hanging cranes / drones)
  for(const a of anchors){
    const near=(rope.active && rope.ax===a.x && rope.ay===a.y);
    ctx.save();
    ctx.shadowColor='#00c8ff'; ctx.shadowBlur=(near?24:10)*perf.fx;
    ctx.fillStyle=near?'#9fe8ff':'#00c8ff';
    // small drone body
    ctx.fillRect(a.x-a.r,a.y-3,a.r*2,6);
    ctx.beginPath(); ctx.arc(a.x,a.y,a.r*0.5,0,7); ctx.fillStyle='#070510'; ctx.fill();
    ctx.shadowBlur=0;
    // rotor blink
    ctx.fillStyle=frame%20<10?'#9cdb3c':'#157a2e';
    ctx.fillRect(a.x-a.r-2,a.y-1,2,2); ctx.fillRect(a.x+a.r,a.y-1,2,2);
    ctx.restore();
  }

  // hazards
  for(const h of hazards) drawHazard(h);

  // explosions
  for(const e of explosions){
    const t=1-e.life/e.max;
    ctx.save();
    ctx.globalAlpha=1-t;
    ctx.shadowColor=t<0.4 ? '#ffffff' : '#ffb020';
    ctx.shadowBlur=(42+(1-t)*18)*perf.fx;
    ctx.strokeStyle=t<0.55 ? '#ffffff' : '#ffb020';
    ctx.lineWidth=6;
    ctx.beginPath(); ctx.arc(e.x,e.y,26+t*120,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=3;
    ctx.strokeStyle='#ff3b30';
    ctx.beginPath(); ctx.arc(e.x,e.y,12+t*82,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(255,210,74,0.22)';
    ctx.beginPath(); ctx.arc(e.x,e.y,16+t*70,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // rope
  if(rope.active){
    ctx.save();
    ctx.strokeStyle='#9cdb3c';
    ctx.lineWidth=3.2;
    ctx.shadowColor='#9cdb3c';
    ctx.shadowBlur=14*perf.fx;
    const mx=(player.x+rope.ax)*0.5;
    const my=(player.y+rope.ay)*0.5;
    const bx=rope.ax-player.x, by=rope.ay-player.y;
    const bend=Math.min(42,Math.max(6,(rope.len-rope.baseLen)*0.42 + Math.abs(rope.omega*rope.len)*0.06 + rope.turns*2.2));
    const bl=Math.hypot(bx,by)||1;
    const ox=(-by/bl)*bend;
    const oy=(bx/bl)*bend;
    ctx.beginPath();
    ctx.moveTo(player.x,player.y);
    ctx.quadraticCurveTo(mx+ox,my+oy,rope.ax,rope.ay);
    ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();
  }

  // trail
  for(let i=0;i<player.trail.length;i++){
    const tr=player.trail[i], al=i/player.trail.length;
    ctx.globalAlpha=al*0.35; ctx.fillStyle='#00c8ff';
    ctx.beginPath(); ctx.arc(tr.x,tr.y,player.r*al*0.8,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // hero
  if(state!=='over' || frame%4<2) drawHero(player.x,player.y,player.faceMul);

  if(state==='pause'){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.34)';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  // particles
  for(const p of particles){
    ctx.globalAlpha=p.life/p.max; ctx.fillStyle=p.color;
    ctx.fillRect(p.x-1,p.y-1,3,3);
  }
  ctx.globalAlpha=1;

  // rising toxic fog (deadly). draw filled below fogLineY
  const fy=fogLineY();
  const fg=ctx.createLinearGradient(0,fy-60,0,fy+200);
  fg.addColorStop(0,'rgba(120,200,60,0)');
  fg.addColorStop(0.4,'rgba(120,200,60,0.45)');
  fg.addColorStop(1,'rgba(60,140,30,0.9)');
  ctx.fillStyle=fg;
  ctx.fillRect(0,fy-60, W, (camY+H+200)-(fy-60));
  // fog crest line
  ctx.strokeStyle='rgba(180,255,90,0.8)'; ctx.lineWidth=2;
  ctx.beginPath();
  for(let x=0;x<=W;x+=20){
    const yy=fy + Math.sin(x*0.05+frame*0.08)*6;
    if(x===0)ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
  }
  ctx.stroke();


  ctx.restore();

  updateAltitudeUI();
}

function drawMeterTntIcon(canvas){
  if(canvas.dataset.drawn==='1') return;
  canvas.dataset.drawn='1';
  canvas.width=60; canvas.height=52;
  const g=canvas.getContext('2d');
  g.imageSmoothingEnabled=false;
  g.clearRect(0,0,60,52);
  const bx=8, by=13, bw=34, bh=28;
  g.fillStyle='#c12218';
  g.beginPath();
  g.moveTo(bx+4,by+4); g.lineTo(bx+bw-5,by+2); g.lineTo(bx+bw-3,by+bh-5); g.lineTo(bx+5,by+bh-3); g.closePath(); g.fill();
  g.fillStyle='#d93a2e';
  g.beginPath();
  g.moveTo(bx+4,by); g.lineTo(bx+bw-6,by+1); g.lineTo(bx+bw-3,by+8); g.lineTo(bx+3,by+7); g.closePath(); g.fill();
  g.fillStyle='#9f2218'; g.fillRect(bx+3,by+bh-8,bw-6,4);
  g.fillStyle='#ffdf62'; g.fillRect(bx+5,by+11,bw-10,9);
  g.fillStyle='#2a0910'; g.font='900 8px Syne, sans-serif'; g.textAlign='center'; g.fillText('TNT',bx+bw/2,by+18);
  g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(bx+4,by+4,3,bh-8); g.fillRect(bx+bw-7,by+4,3,bh-8);
  g.strokeStyle='#ffb020'; g.lineWidth=3;
  g.beginPath(); g.moveTo(bx+bw-4,by+6); g.quadraticCurveTo(bx+bw+8,by-6,bx+bw+18,by); g.stroke();
  g.fillStyle='#fff3a0'; g.fillRect(bx+bw+17,by-2,5,5);
  g.fillStyle='#ffd54a'; g.fillRect(bx+bw+22,by-4,2,2); g.fillRect(bx+bw+14,by+1,2,2);
}

function updateAltitudeUI(){
  const now=altitude||0;
  const gasAlt=Math.max(0,Math.floor(-fogLineY()/12));
  const hazardList=Array.isArray(hazards) ? hazards : [];
  const tntAlts=hazardList
    .map(h=>Math.max(0,Math.floor(-(h.y+h.h*0.5)/12)))
    .filter(a=>a>=now && a<=now+500)
    .sort((a,b)=>a-b);
  const tntGroups=[];
  for(const tntAlt of tntAlts){
    const last=tntGroups[tntGroups.length-1];
    if(last && Math.abs(last.alt-tntAlt)<=6) last.count++;
    else tntGroups.push({alt:tntAlt,count:1});
  }
  const highestTnt=tntGroups.length ? Math.max(...tntGroups.map(g=>g.alt)) : 0;
  const scale=Math.max(200,Math.ceil((Math.max(now,best,gasAlt,highestTnt)+80)/100)*100);
  const nowPct=Math.min(100,now/scale*100);
  const bestPct=Math.min(100,best/scale*100);
  const gasPct=Math.min(100,gasAlt/scale*100);
  document.getElementById("meterScale").textContent=scale+"m";
  document.getElementById("altFill").style.height=nowPct+"%";
  document.getElementById("meterNow").style.bottom=nowPct+"%";
  document.getElementById("meterBest").style.bottom=bestPct+"%";
  document.getElementById("meterGas").style.bottom=gasPct+"%";
  document.getElementById("meterNowText").textContent="NOW "+now+"m";
  document.getElementById("meterBestText").textContent="BEST "+best+"m";
  document.getElementById("meterGasText").textContent="GAS "+gasAlt+"m";
  document.getElementById("topHeightNum").textContent=now;

  const tntWrap=document.getElementById("meterTnt");
  if(tntWrap){
    while(tntWrap.children.length<tntGroups.length){
      const mark=document.createElement("div");
      mark.className="tnt-meter-mark hidden";
      mark.innerHTML='<span class="tnt-alt"></span><img class="tnt-mini" src="tnt.png" alt="" aria-hidden="true"><span class="tnt-count"></span>';
      tntWrap.appendChild(mark);
    }
    for(let i=0;i<tntWrap.children.length;i++){
      const mark=tntWrap.children[i];
      const group=tntGroups[i];
      const tntAlt=group && group.alt;
      if(tntAlt==null){
        mark.classList.add("hidden");
      }else{
        mark.classList.remove("hidden");
        mark.style.bottom=Math.min(100,tntAlt/scale*100)+"%";
        mark.querySelector(".tnt-alt").textContent=tntAlt+"m";
        mark.querySelector(".tnt-count").textContent="x"+group.count;
      }
    }
  }
}

const STEP_HZ=120;
const STEP_MS=1000/STEP_HZ;
let lastLoopTs=0, stepAcc=0;
function loop(ts){
  if(!ts) ts=performance.now();
  if(!lastLoopTs) lastLoopTs=ts;
  const delta=Math.min(80,ts-lastLoopTs);
  lastLoopTs=ts;
  stepAcc+=delta;

  let steps=0;
  while(stepAcc>=STEP_MS && steps<8){
    update();
    stepAcc-=STEP_MS;
    steps++;
  }
  if(steps===8) stepAcc=0;

  draw();
  requestAnimationFrame(loop);
}
resize();
updateAltitudeUI();
reset();
requestAnimationFrame(loop);
